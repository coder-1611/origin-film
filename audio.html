<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ORIGIN — score render</title></head>
<body style="background:#000;color:#ccc;font:14px monospace">
<pre id="log">rendering score offline…</pre>
<script type="module">
import { renderOffline } from './src/audio/engine.js';
const log = (m) => { document.getElementById('log').textContent += '\n' + m; console.log('[score] ' + m); };
window.__renderScore = async () => {
  const buf = await renderOffline(log);
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  const inter = new Float32Array(L.length * 2);
  let peak = 0;
  for (let i = 0; i < L.length; i++) { inter[2 * i] = L[i]; inter[2 * i + 1] = R[i]; peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i])); }
  const res = await fetch('/__upload?name=score-raw.f32', { method: 'POST', body: inter.buffer });
  return { frames: L.length, sampleRate: buf.sampleRate, peak, upload: res.status };
};
</script>
</body></html>
